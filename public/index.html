<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paradigm Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Paradigm Explorer</h1>
    <nav><a href="dashboard.html">Dashboard</a><a href="employees.html">Employees</a><a href="index.html" aria-current="page">Explorer</a></nav>
  </header>
  <main>
    <form id="query">
      <label>Endpoint <select name="path" required></select></label>
      <label>Page <input name="page" type="number" min="1" value="1"></label>
      <label>Rows <input name="rows" type="number" min="1" max="500" value="25"></label>
      <label class="wide">Filter <input name="filter" placeholder="StrCompanyName Contains Lumber"></label>
      <label class="wide" id="props-label" hidden>Properties <input name="properties" placeholder="StrCustomerId,StrCompanyName"></label>
      <button type="submit">Run</button>
    </form>
    <p id="status" role="status"></p>
    <div class="table-wrap"><table id="results"></table></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
