<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employees</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="employees.css">
</head>
<body>
  <header>
    <h1>Employees</h1>
    <nav><a href="dashboard.html">Dashboard</a><a href="employees.html" aria-current="page">Employees</a><a href="index.html">Explorer</a></nav>
  </header>
  <main class="page">
    <form id="search" class="toolbar" role="search">
      <label class="wide">Search <input type="search" name="search" placeholder="ID, name, department or email"></label>
      <label class="check"><input type="checkbox" name="all"> Show all <span class="muted">(include terminated)</span></label>
    </form>
    <p id="status" role="status"></p>
    <div class="table-wrap">
      <table id="list">
        <thead>
          <tr>
            <th aria-sort="none"><button type="button" data-sort="id">Employee ID</button></th>
            <th aria-sort="none"><button type="button" data-sort="name">Name</button></th>
            <th aria-sort="none"><button type="button" data-sort="department">Department</button></th>
            <th aria-sort="none"><button type="button" data-sort="email">Email</button></th>
            <th aria-sort="none"><button type="button" data-sort="salesman">Salesman</button></th>
            <th aria-sort="none"><button type="button" data-sort="status">Status</button></th>
            <th><span class="sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <nav class="pager" aria-label="Pages">
      <button type="button" id="prev">Previous</button>
      <span id="page-info"></span>
      <button type="button" id="next">Next</button>
    </nav>
  </main>
  <script src="employees.js"></script>
</body>
</html>
