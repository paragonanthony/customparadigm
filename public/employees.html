<!doctype html>
<html lang="en">

  <link rel="stylesheet" href="styles.css">

<body>

        </thead>
        <tbody></tbody>
      </table>
    </div>
    <nav class="pager" aria-label="Pages">
      <button type="button" id="prev">Previous</button>
      <span id="page-info"></span>
      <button type="button" id="next">Next</button>
    </nav>

  <script src="employees.js"></script>
